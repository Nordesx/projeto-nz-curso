    <main>
        <figure>
            <figcaption>Tabela 1: Discografia oficial de estúdio da banda Nação Zumbi (1994 - 2017)</figcaption>
            <table style="border-collapse: collapse; border: 1px solid #000;">
                <caption>Discografia de Estúdio da Banda Nação Zumbi</caption>

                <thead>
                    <tr>
                        <th scope="col">Nome do Álbum</th>
                        <th scope="col">Ano de Lançamento</th>
                        <th scope="col">Descrição</th>
                        <th scope="col">Capas</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <th scope="row">Da Lama ao Caos</th>
                        <td>1994</td>
                        <td>Obra-prima do Manguebeat com Chico Science, misturando maracatu, rock e funk.</td>
                        <td><img src="../assets/images/da_lama_ao_caos.jpg" alt="Capa do álbum Da Lama ao Caos"></td>
                    </tr>

                    <tr>
                        <th scope="row">Afrociberdelia</th>
                        <td>1996</td>
                        <td>Último álbum com Chico Science, focado em psicodelia, elementos eletrônicos e ritmos afro.
                        </td>
                        <td><img src="../assets/images/afrociberdelia.jpg" alt="Capa do álbum Afrociberdelia"></td>
                    </tr>

                    <tr>
                        <th scope="row">CSNZ</th>
                        <td>1998</td>
                        <td>Álbum duplo misto que homenageia Chico Science com faixas inéditas de estúdio e remixes.
                        </td>
                        <td><img src="../assets/images/cd_csnz.jpg" alt="Capa do álbum CSNZ"></td>
                    </tr>

                    <tr>
                        <th scope="row">Rádio S.Amb.A.</th>
                        <td>2000</td>
                        <td>Primeiro álbum totalmente inédito com Jorge du Peixe nos vocais, marcando uma nova era.</td>
                        <td><img src="../assets/images/radio_samba.jpg" alt="Capa do álbum Rádio S.Amb.A."></td>
                    </tr>

                    <tr>
                        <th scope="row">Nação Zumbi</th>
                        <td>2002</td>
                        <td>Trabalho homônimo amadurecido que consolida o peso dos tambores e o groove pós-punk.</td>
                        <td><img src="../assets/images/nacao_zumbi.jpg" alt="Capa do álbum Nação Zumbi"></td>
                    </tr>

                    <tr>
                        <th scope="row">Futura</th>
                        <td>2005</td>
                        <td>Explora uma sonoridade mais densa, abstrata, com texturas modernas e dub.</td>
                        <td><img src="../assets/images/futura.jpg" alt="Capa do álbum Futura"></td>
                    </tr>

                    <tr>
                        <th scope="row">Fome de Tudo</th>
                        <td>2007</td>
                        <td>Produzido por Mario Caldato Jr., traz uma pegada pop-rock enérgica sem perder as raízes.
                        </td>
                        <td><img src="../assets/images/fome_de_tudo.jpg" alt="Capa do álbum Fome de Tudo"></td>
                    </tr>

                    <tr>
                        <th scope="row">Nação Zumbi (2014)</th>
                        <td>2014</td>
                        <td>Segundo disco homônimo, celebra os 20 anos de estrada com arranjos refinados e parcerias.
                        </td>
                        <td><img src="../assets/images/nacao_zumbi_2014.jpg" alt="Capa do álbum Nação Zumbi (2014)">
                        </td>
                    </tr>

                    <tr>
                        <th scope="row">Radiola NZ Vol. 1</th>
                        <td>2017</td>
                        <td>Álbum dedicado a regravações e versões de clássicos que influenciaram a identidade da banda.
                        </td>
                        <td><img src="../assets/images/radiola.jpg" alt="Capa do álbum Radiola NZ Vol. 1"></td>
                    </tr>
                </tbody>
            </table>

            <dl>
                <dt><strong>Da Lama ao Caos (1994)</strong></dt>
                <dd>Álbum de estreia e marco zero do Manguebeat com Chico Science, fundindo maracatu, rock pesado e hip-hop.</dd>

                <dt><strong>Afrociberdelia (1996)</strong></dt>
                <dd>Último disco gravado com Chico Science, trazendo uma forte pegada psicodélica, eletrônica e afro.</dd>

                <dt><strong>CSNZ (1998)</strong></dt>
                <dd>Álbum duplo misto que homenageia Chico Science com canções de estúdio que ficaram guardadas e remixes feitos por DJs.</dd>

                <dt><strong>Rádio S.Amb.A. (2000)</strong></dt>
                <dd>Início oficial da nova era da banda com Jorge du Peixe assumindo em definitivo os vocais principais.</dd>

                <dt><strong>Nação Zumbi (2002)</strong></dt>
                <dd>Trabalho homônimo denso e focado no peso da cozinha rítmica, consolidando a identidade pós-Chico Science.</dd>

                <dt><strong>Futura (2005)</strong></dt>
                <dd>Explora texturas futuristas e abstratas com forte influência de arranjos de metais, dub e reggae.</dd>

                <dt><strong>Fome de Tudo (2007)</strong></dt>
                <dd>Produzido por Mario Caldato Jr., apresenta uma sonoridade pop-rock mais enérgica, direta e focada em grooves modernos.</dd>

                <dt><strong>Nação Zumbi (2014)</strong></dt>
                <dd>Segundo álbum homônimo, celebrando os 20 anos da banda com produção refinada e participações especiais.</dd>

                <dt><strong>Radiola NZ Vol. 1 (2017)</strong></dt>
                <dd>Projeto composto exclusivamente por versões e releituras de músicas clássicas que formaram a bagagem da banda.</dd>
            </dl>
